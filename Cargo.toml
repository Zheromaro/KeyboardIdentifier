[package]
name = "keyboard_identifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Async keyboard enumeration and hotplug events for Linux and Windows"
license = "MIT"
repository = "https://github.com/Zheromaro/KeyboardIdentifier"
homepage = "https://github.com/Zheromaro/KeyboardIdentifier"
documentation = "https://docs.rs/keyboard_identifier"
keywords = ["keyboard", "input", "hid", "hardware", "async"]
categories = ["hardware-support", "os::linux-apis", "os::windows-apis"]


[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "x86_64-pc-windows-msvc"]

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "rt-multi-thread"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13.2", features = ["device-test", "futures-core", "serde", "stream-trait", "tokio"] }
udev = { version = "0.9.3", features = ["send", "sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
]}
